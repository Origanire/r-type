site_name: R-Type
site_description: Developer documentation of the R-Type project and its game engine
docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Building: getting-started/building.md
      - Running: getting-started/running.md
  - Architecture:
      - Overview: architecture/overview.md
      - Engine modules: architecture/engine-modules.md
      - ECS: architecture/ecs.md
      - Networking: architecture/networking.md
      - Threading: architecture/threading.md
      - Rendering: architecture/rendering.md
  - Protocol (RFC): protocol/rfc-rtype.md
  - Guides:
      - Add a component: guides/add-a-component.md
      - Add a system: guides/add-a-system.md
      - Add an enemy: guides/add-an-enemy.md
      - Add a wave: guides/add-a-wave.md
  - Comparative study:
      - Overview: comparative-study/index.md
      - Libraries: comparative-study/libraries.md
      - Algorithms and data structures: comparative-study/algorithms-and-data-structures.md
      - Storage: comparative-study/storage.md
      - Security: comparative-study/security.md
      - Networking: comparative-study/networking.md
  - Accessibility: accessibility.md
