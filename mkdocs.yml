site_name: R-Type
site_description: Developer documentation of the R-Type project and its game engine
docs_dir: doc

theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Home: index.md
  - Network documentation: RESEAU.md
  - Architecture:
      - Overview: architecture/overview.md
      - Engine modules: architecture/engine-modules.md
      - ECS: architecture/ecs.md
      - Rendering: architecture/rendering.md
  - Coding conventions: conventions.md
  - Guides:
      - Add a component: guides/add-a-component.md
      - Add a system: guides/add-a-system.md
  - Implementation roadmap: roadmap.md
